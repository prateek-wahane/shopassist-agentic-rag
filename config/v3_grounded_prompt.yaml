name: v3_grounded_prompt
description: Fix 2 (generation). Keep v2 retrieval; switch to a grounded prompt with scope, refusal and no-invention rules.

retrieval:
  mode: hybrid
  top_k: 3
  candidates: 20
  rerank: true
  mmr: false
  mmr_lambda: 0.6

generation:
  model: openai/gpt-oss-20b   # Groq model id - list yours: python -c "from groq import Groq; print([m.id for m in Groq().models.list().data])"
  temperature: 0
  max_tokens: 1024     # gpt-oss reasoning tokens count toward this cap
  reasoning_effort: low
  prompt: prompts/grounded.txt
  price_in_per_m: 0.075
  price_out_per_m: 0.30
