name: v2_hybrid_rerank
description: Fix 1 (retrieval). Add BM25 keyword search fused with dense via RRF, then cross-encoder rerank. Prompt unchanged.

retrieval:
  mode: hybrid
  top_k: 3
  candidates: 20
  rerank: true
  mmr: false
  mmr_lambda: 0.6

generation:
  model: openai/gpt-oss-20b   # Groq model id - list yours: python -c "from groq import Groq; print([m.id for m in Groq().models.list().data])"
  temperature: 0
  max_tokens: 1024     # gpt-oss reasoning tokens count toward this cap
  reasoning_effort: low
  prompt: prompts/friendly.txt
  price_in_per_m: 0.075
  price_out_per_m: 0.30
